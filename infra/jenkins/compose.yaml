services:
  jenkins:
    build: .
    # Local assignment environment only: access to Docker Desktop's daemon.
    user: root
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NETWORK_CA_FILE: /run/network-certs/network-ca.pem
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../backend/certs:/run/network-certs:ro
    restart: unless-stopped

volumes:
  jenkins_home:
