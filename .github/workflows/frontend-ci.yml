name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps
    
    - name: Run linter (if configured)
      working-directory: ./frontend
      run: npm run lint --if-present || echo "Linting not configured, skipping..."
      continue-on-error: true
    
    - name: Check formatting with Prettier
      working-directory: ./frontend
      run: |
        npx prettier --check "src/**/*.{ts,html,css,scss}" || echo "Prettier check found formatting issues"
      continue-on-error: true
    
    - name: Build application
      working-directory: ./frontend
      run: npm run build -- --configuration=production
    
    - name: Check build output
      working-directory: ./frontend
      run: |
        if [ -d "dist" ]; then
          echo "Build successful! Contents:"
          ls -lah dist/
        else
          echo "Build output not found in expected location"
          exit 1
        fi

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      working-directory: ./frontend
      run: |
        docker build -t smart-spotify-frontend:${{ github.sha }} .
        docker image ls
